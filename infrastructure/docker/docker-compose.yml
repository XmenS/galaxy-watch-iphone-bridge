name: galaxy-health-bridge

x-app-env: &app-env
  ENV: ${ENV:-prod}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ghb}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  E2E_REQUIRED: ${E2E_REQUIRED:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ../../services/api
      target: prod
    image: ghcr.io/galaxy-health-bridge/api:${GHB_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 25s

  migrate:
    image: ghcr.io/galaxy-health-bridge/api:${GHB_VERSION:-latest}
    build:
      context: ../../services/api
      target: prod
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  worker:
    build:
      context: ../../services/worker
    image: ghcr.io/galaxy-health-bridge/worker:${GHB_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  beat:
    image: ghcr.io/galaxy-health-bridge/worker:${GHB_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      worker:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.main:celery", "beat", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ghb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
