# Example only. In real deployments use SealedSecrets, External Secrets, or
# the cloud's KMS-backed CSI driver. NEVER commit real values to git.
apiVersion: v1
kind: Secret
metadata:
  name: ghb-secret
  namespace: galaxy-health-bridge
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  ENCRYPTION_KEY: "REPLACE_ME_64_HEX_CHARS"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql+asyncpg://ghb:REPLACE_ME@ghb-postgres:5432/ghb"
  REDIS_URL: "redis://ghb-redis:6379/0"
