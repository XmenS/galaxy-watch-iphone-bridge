apiVersion: v1
kind: Service
metadata:
  name: ghb-api
  namespace: galaxy-health-bridge
  labels: { app.kubernetes.io/name: ghb-api }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: ghb-api }
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ghb-api
  namespace: galaxy-health-bridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ghb-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu,    target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ghb-api
  namespace: galaxy-health-bridge
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ghb-api }
