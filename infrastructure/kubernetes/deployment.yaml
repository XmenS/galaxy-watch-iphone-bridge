---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghb-api
  namespace: galaxy-health-bridge
  labels: { app.kubernetes.io/name: ghb-api }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: ghb-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ghb-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/galaxy-health-bridge/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: { name: ghb-config }
            - secretRef:    { name: ghb-secret }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghb-worker
  namespace: galaxy-health-bridge
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ghb-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ghb-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/galaxy-health-bridge/worker:latest
          envFrom:
            - configMapRef: { name: ghb-config }
            - secretRef:    { name: ghb-secret }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghb-beat
  namespace: galaxy-health-bridge
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ghb-beat }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ghb-beat }
    spec:
      containers:
        - name: beat
          image: ghcr.io/galaxy-health-bridge/worker:latest
          command: ["celery","-A","app.main:celery","beat","--loglevel=INFO"]
          envFrom:
            - configMapRef: { name: ghb-config }
            - secretRef:    { name: ghb-secret }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ghb-migrate
  namespace: galaxy-health-bridge
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/galaxy-health-bridge/api:latest
          command: ["alembic","upgrade","head"]
          envFrom:
            - configMapRef: { name: ghb-config }
            - secretRef:    { name: ghb-secret }
