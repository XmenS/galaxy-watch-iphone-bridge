name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service == 'api' && 'api' || 'worker' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          target: ${{ matrix.service == 'api' && 'prod' || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        env: { COSIGN_EXPERIMENTAL: "1" }
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            cosign sign --yes "$tag"
          done

  watch-apk:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble debug APK
        working-directory: apps/wearos
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Rename APK to match release naming
        run: |
          mkdir -p artifacts
          cp apps/wearos/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/wearos-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wearos-apk
          path: artifacts/wearos-app-debug.apk

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-images, watch-apk]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: wearos-apk
          path: artifacts/
      - uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env: { OUTPUT: CHANGES.md }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          generate_release_notes: true
          files: |
            artifacts/wearos-app-debug.apk
