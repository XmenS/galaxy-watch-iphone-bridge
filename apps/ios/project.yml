name: GalaxyHealthBridge
options:
  bundleIdPrefix: dev.galaxyhealthbridge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_WARN_STRICT_PROTOTYPES: YES

targets:
  GalaxyHealthBridge:
    type: application
    platform: iOS
    sources:
      - path: GalaxyHealthBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxyhealthbridge.app.piyush2026
        INFOPLIST_FILE: GalaxyHealthBridge/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: GalaxyHealthBridge/App/GalaxyHealthBridge.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreBluetooth.framework
    capabilities:
      HealthKit:
        enabled: true
      BackgroundModes:
        modes: [bluetooth-central]

  GalaxyHealthBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GalaxyHealthBridgeTests
    dependencies:
      - target: GalaxyHealthBridge

schemes:
  GalaxyHealthBridge:
    build:
      targets:
        GalaxyHealthBridge: all
        GalaxyHealthBridgeTests: [test]
    test:
      targets:
        - GalaxyHealthBridgeTests
